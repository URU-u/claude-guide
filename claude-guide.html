<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude ガイド — 機能まるわかりQ&A</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f10;
      --surface: #1a1a1d;
      --surface2: #242428;
      --border: #2e2e33;
      --accent: #cc785c;
      --accent2: #e8966e;
      --text: #e8e8e8;
      --text-muted: #888;
      --user-bubble: #cc785c;
      --ai-bubble: #242428;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 600;
    }
    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #apiKeyInput {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      width: 200px;
      outline: none;
      transition: border-color 0.2s;
    }
    #apiKeyInput:focus { border-color: var(--accent); }
    #apiKeyInput::placeholder { color: var(--text-muted); }
    .key-label {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ── Layout ── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 16px 12px;
      flex-shrink: 0;
      overflow-y: auto;
    }
    .sidebar h3 {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 10px;
    }
    .quick-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 6px;
      line-height: 1.4;
      transition: background 0.15s, border-color 0.15s;
    }
    .quick-btn:hover {
      background: var(--surface2);
      border-color: var(--accent);
    }

    /* ── Chat area ── */
    .chat-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    /* Welcome */
    .welcome {
      text-align: center;
      margin: auto;
      max-width: 480px;
    }
    .welcome .icon {
      font-size: 40px;
      margin-bottom: 14px;
    }
    .welcome h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .welcome p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* Bubbles */
    .msg {
      display: flex;
      gap: 10px;
      max-width: 720px;
    }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.ai { align-self: flex-start; }
    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      margin-top: 2px;
    }
    .msg.user .avatar { background: var(--user-bubble); }
    .msg.ai  .avatar { background: var(--accent); }
    .bubble {
      padding: 12px 15px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.7;
      max-width: 600px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .bubble {
      background: var(--user-bubble);
      color: #fff;
      border-bottom-right-radius: 3px;
    }
    .msg.ai .bubble {
      background: var(--ai-bubble);
      color: var(--text);
      border-bottom-left-radius: 3px;
    }
    .bubble strong { color: var(--accent2); }
    .bubble code {
      background: #1a1a1d;
      border: 1px solid var(--border);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: "SF Mono", Menlo, monospace;
      font-size: 12px;
    }

    /* Typing indicator */
    .typing .bubble {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 14px 16px;
    }
    .dot {
      width: 7px; height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: .5; }
      40% { transform: translateY(-6px); opacity: 1; }
    }

    /* ── Input bar ── */
    .input-bar {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    #userInput {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      resize: none;
      outline: none;
      min-height: 44px;
      max-height: 120px;
      line-height: 1.5;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    #userInput:focus { border-color: var(--accent); }
    #userInput::placeholder { color: var(--text-muted); }
    #sendBtn {
      background: var(--accent);
      border: none;
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }
    #sendBtn:hover { background: var(--accent2); }
    #sendBtn:active { transform: scale(.95); }
    #sendBtn:disabled { opacity: .4; cursor: not-allowed; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">✦</div>
    Claude ガイド
  </div>
  <div class="header-right">
    <span class="key-label">API Key</span>
    <input id="apiKeyInput" type="password" placeholder="sk-ant-..." />
  </div>
</header>

<div class="main">
  <!-- Sidebar: quick questions -->
  <aside class="sidebar">
    <h3>よくある質問</h3>
    <button class="quick-btn" onclick="quickSend('Claude Codeとは何ですか？どんなことができますか？')">Claude Codeって何？</button>
    <button class="quick-btn" onclick="quickSend('Claudeのプロジェクト機能の使い方を教えてください')">プロジェクト機能の使い方</button>
    <button class="quick-btn" onclick="quickSend('Claude Coworkとは何ですか？通常のClaudeとどう違いますか？')">Coworkって何が違う？</button>
    <button class="quick-btn" onclick="quickSend('Claudeのチャットでできることを一覧で教えてください')">チャットでできること一覧</button>
    <button class="quick-btn" onclick="quickSend('Claude APIとは何ですか？どうやって使いますか？')">Claude APIの使い方</button>
    <button class="quick-btn" onclick="quickSend('ClaudeのMCP（Model Context Protocol）とは何ですか？')">MCPとは？</button>
    <button class="quick-btn" onclick="quickSend('Claude Codeのスラッシュコマンド一覧を教えてください')">スラッシュコマンド一覧</button>
    <button class="quick-btn" onclick="quickSend('Claudeのモデルの種類と違いを教えてください（Opus, Sonnet, Haiku）')">モデルの違いは？</button>
    <button class="quick-btn" onclick="quickSend('プロンプトキャッシュとは何ですか？どんなメリットがありますか？')">プロンプトキャッシュとは？</button>
    <button class="quick-btn" onclick="quickSend('Claude Codeのhooks機能とは何ですか？')">hooksって何？</button>
    <button class="quick-btn" onclick="quickSend('Claude CodeのCLAUDE.md、スキル(skills)、/goalコマンドの使い方を教えてください')">CLAUDE.md・スキル・/goalとは？</button>
  </aside>

  <!-- Chat -->
  <div class="chat-wrap">
    <div id="messages">
      <div class="welcome">
        <div class="icon">✦</div>
        <h2>Claude ガイド</h2>
        <p>Claude Code・Cowork・チャット・プロジェクト・APIなど<br>Claude全般の使い方について何でも聞いてください。<br><br>左のよくある質問からも始められます。</p>
      </div>
    </div>

    <div class="input-bar">
      <div class="input-row">
        <textarea id="userInput" rows="1" placeholder="例：Claude Codeでファイルを編集するには？"></textarea>
        <button id="sendBtn" onclick="sendMessage()" title="送信 (Ctrl+Enter)">↑</button>
      </div>
    </div>
  </div>
</div>

<script>
const SYSTEM_PROMPT = `あなたは「Claudeガイド」というAIアシスタントです。ユーザーがClaude（Anthropic）の各種機能について質問したとき、わかりやすく日本語で答えるのがあなたの役割です。

## あなたが詳しく説明できる範囲

### Claude製品・インターフェース
- **claude.ai チャット**: 通常のウェブチャット。会話履歴、プロジェクト、添付ファイル、Artifactsなど
- **Claude プロジェクト機能**: プロジェクトごとにシステムプロンプト・ナレッジを設定し、会話を整理できる機能
- **Claude Code (CLI)**: ターミナルから使えるClaude。コードベース全体を読み込んでソフトウェアエンジニアリングを支援するCLIツール
- **Claude Cowork**: 複数のClaudeエージェントが協調して複雑なタスクを実行するプラットフォーム。スキル・エージェント・ツールを組み合わせた高度な自動化

### Claude Code の機能
- スラッシュコマンド: /help, /clear, /config, /compact, /cost, /doctor, /init, /login, /logout, /memory, /model, /pr_comments, /release-notes, /review, /status, /terminal-setup, /vim など
- hooksシステム: pre-tool-use, post-tool-use, pre-compact, notification, stop などのイベントに対してシェルスクリプトを実行
- メモリ機能: CLAUDE.mdファイルによるプロジェクト設定・ユーザー設定
- MCP (Model Context Protocol): 外部ツール・サービスとの連携プロトコル
- パーミッション管理: ツール実行の許可・拒否設定
- Plan mode: 実行前に計画を立ててユーザーに確認するモード
- ワークツリー機能: gitのworktreeを使った安全な並行作業
- CLAUDE.md: プロジェクトのルート（や親ディレクトリ、ユーザーホーム）に置くMemoryファイル。コーディング規約、注意点、頻出する間違いとその防止ルールなどを書いておくと、Claudeが作業前に自動で読み込んで参照する
- スキル (Skills): `.claude/skills/<名前>/SKILL.md` に手順を書いておくことで、特定の作業を自動化できる機能。CLAUDE.mdから「この状況になったらこのスキルを使う」と参照させることで、明示的に指示しなくても自動的に発動させることも可能
- /goal コマンド: 1回の指示ではなく「完了条件」を指定して、その条件が満たされるまでClaudeが複数ターンにわたって自律的に作業を続ける機能。完了したかどうかは別のモデルが会話内容を見て毎ターン判定するため、条件には「テストのグリーンな実行結果を貼り付ける」のように、実際に確認できる証拠を含めるのが望ましい。無制限に走らせるとコストがかさむため、ターン数や時間の上限も条件に含めるのが安全
- 動的ワークフロー / サブエージェント: 大きなタスクをサブエージェントに分割し、並列・バックグラウンドで実行させる仕組み。Agentツールやオーケストレーションスクリプトを使って処理をスケールさせられる

### Claude API / Anthropic SDK
- Messages API: テキスト・画像入力、ストリーミング、tool use（ツール呼び出し）
- モデル: claude-opus-4-8（最高性能）, claude-sonnet-4-6（バランス）, claude-haiku-4-5（高速・低コスト）
- プロンプトキャッシュ: 繰り返しのコンテキストをキャッシュしてコスト削減・高速化
- Batch API: 大量リクエストの非同期処理
- Files API: ファイルのアップロード・管理
- Extended thinking: Claude Opusの深い思考機能

### その他
- Artifacts: コード・HTML・SVGなどをプレビューできるUIコンポーネント
- Computer use: Claudeがコンピュータ操作を行う機能

## 回答スタイル
- 日本語で、初心者にもわかりやすく説明する
- 具体例やコマンド例を積極的に使う
- 箇条書きや見出しを使って整理する
- わからないことは正直に「確認が必要です」と伝える
- 最新情報は2025年8月時点のものが基準（それ以降は不確かな場合がある）`;

let history = [];
let isLoading = false;

function getApiKey() {
  return document.getElementById('apiKeyInput').value.trim();
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

document.getElementById('userInput').addEventListener('input', function() {
  autoResize(this);
});

document.getElementById('userInput').addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    sendMessage();
  }
});

function appendMsg(role, text) {
  // Remove welcome screen on first message
  const welcome = document.querySelector('.welcome');
  if (welcome) welcome.remove();

  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="avatar">${role === 'user' ? '👤' : '✦'}</div>
    <div class="bubble">${escHtml(text)}</div>
  `;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function appendTyping() {
  const welcome = document.querySelector('.welcome');
  if (welcome) welcome.remove();

  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ai typing';
  div.id = 'typing-indicator';
  div.innerHTML = `
    <div class="avatar">✦</div>
    <div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  `;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function escHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\n/g, '<br>');
}

async function sendMessage(text) {
  const input = document.getElementById('userInput');
  const userText = text || input.value.trim();
  if (!userText || isLoading) return;

  const apiKey = getApiKey();
  if (!apiKey) {
    alert('右上に Anthropic API キーを入力してください。\n\nAPIキーは https://console.anthropic.com で取得できます。');
    return;
  }

  if (!text) {
    input.value = '';
    autoResize(input);
  }

  isLoading = true;
  document.getElementById('sendBtn').disabled = true;

  appendMsg('user', userText);
  history.push({ role: 'user', content: userText });

  const typing = appendTyping();

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-calls': 'true',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1024,
        system: SYSTEM_PROMPT,
        messages: history,
      }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${res.status}`);
    }

    const data = await res.json();
    const reply = data.content[0].text;

    removeTyping();
    appendMsg('ai', reply);
    history.push({ role: 'assistant', content: reply });

  } catch (e) {
    removeTyping();
    appendMsg('ai', `エラーが発生しました: ${e.message}\n\nAPIキーを確認するか、しばらく経ってから再試行してください。`);
    history.pop(); // remove last user msg from history on error
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('userInput').focus();
}

function quickSend(text) {
  sendMessage(text);
}
</script>

</body>
</html>
